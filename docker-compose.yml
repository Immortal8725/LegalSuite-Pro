# Local:   docker compose up -d postgres            (Postgres only, run the API and web from source)
# Dev mail: docker compose --profile dev up -d       (adds Mailpit on http://127.0.0.1:8025)
# Hosted:  docker compose --profile hosted up -d --build
# Every secret comes from .env (copy .env.example). Compose refuses to start without the required ones.
name: legalsuite

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: legalsuite
      POSTGRES_USER: ${DB_USER:-legalsuite}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    # Bound to this machine only. Do not publish Postgres to the internet.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - legalsuite-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-legalsuite} -d legalsuite"]
      interval: 5s
      timeout: 5s
      retries: 12

  mailpit:
    profiles: ["dev"]
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  api:
    profiles: ["hosted"]
    image: owlaw-api
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      PORT: "18081"
      DATABASE_URL: jdbc:postgresql://postgres:5432/legalsuite
      DB_USER: ${DB_USER:-legalsuite}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      LEGALSUITE_JWT_SECRET: ${LEGALSUITE_JWT_SECRET:?Set LEGALSUITE_JWT_SECRET in .env (32+ random characters)}
      APP_URL: ${APP_URL:?Set APP_URL in .env, for example https://app.example.co.za}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${APP_URL}}
      LEGALSUITE_UPLOAD_DIR: /app/uploads
      # The web container is the only client; it forwards the real address.
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-native}
    volumes:
      - legalsuite-uploads:/app/uploads
    expose:
      - "18081"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18081}:18081"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["hosted"]
    image: owlaw-web
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://api:18081
        NEXT_PUBLIC_PUBLIC_SITE_ROOT: ${NEXT_PUBLIC_PUBLIC_SITE_ROOT:-}
    restart: unless-stopped
    environment:
      PORT: "3000"
    # Put a TLS-terminating proxy (Caddy, nginx, a cloud load balancer) in front of this port.
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  legalsuite-pg:
  legalsuite-uploads:
