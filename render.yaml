# Render blueprint for Owlaw on FREE instances only.
# Free limits: web services sleep after 15 min idle (first request ~1 min to wake), 512 MB RAM,
# 0.1 CPU, no persistent disk (files go to the S3 bucket); free Postgres expires 30 days after creation.
databases:
  - name: owlaw-db
    plan: free
    region: frankfurt
    databaseName: owlaw
    user: owlaw
    postgresMajorVersion: "17"

services:
  - type: web
    name: owlaw-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DB_HOST
        fromDatabase: { name: owlaw-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: owlaw-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: owlaw-db, property: database }
      - key: DB_USER
        fromDatabase: { name: owlaw-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: owlaw-db, property: password }
      - key: JAVA_OPTS
        # 512 MB box: cap heap, small thread stacks, serial GC, quick JIT for 0.1 CPU.
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError
      - key: LEGALSUITE_JWT_SECRET
        generateValue: true
      - key: LEGALSUITE_DEMO_DATA
        value: "false"
      - key: FORWARD_HEADERS_STRATEGY
        value: native
      - key: APP_URL
        sync: false            # https://owlaw-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false            # same as APP_URL
      - key: LEGALSUITE_OPERATOR_EMAIL
        sync: false
      - key: LEGALSUITE_OPERATOR_PASSWORD
        sync: false
      - key: PAYFAST_ENV
        value: sandbox
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: PAYFAST_PASSPHRASE
        sync: false
      - key: PAYFAST_RETURN_URL
        sync: false
      - key: PAYFAST_CANCEL_URL
        sync: false
      - key: PAYFAST_NOTIFY_URL
        sync: false
      - key: LEGALSUITE_STORAGE_TYPE
        value: s3
      - key: LEGALSUITE_STORAGE_S3_ENDPOINT
        sync: false            # https://<project-ref>.storage.supabase.co/storage/v1/s3
      - key: LEGALSUITE_STORAGE_S3_REGION
        sync: false
      - key: LEGALSUITE_STORAGE_S3_BUCKET
        value: owlaw-files
      - key: LEGALSUITE_STORAGE_S3_ACCESS_KEY
        sync: false
      - key: LEGALSUITE_STORAGE_S3_SECRET_KEY
        sync: false

  - type: web
    name: owlaw-web
    runtime: node
    plan: free
    region: frankfurt
    rootDir: frontend
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_API_URL
        sync: false            # public API URL, e.g. https://owlaw-api.onrender.com (baked in at build)
      - key: NEXT_PUBLIC_DEMO_DATA
        value: "false"         # demo sign-in shortcuts; unset or false in production
