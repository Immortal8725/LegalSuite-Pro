# Keeps the free Render services warm during working hours so users do not wait for a cold start.
# Window: Monday to Saturday, 06:00 to 18:00 SAST (04:00 to 16:00 UTC), every 10 minutes (Render sleeps after 15).
# Budget: 3 free services share 750 instance hours a month. Two services x 27 days x ~12.1 h = ~652 h, leaving ~98 h
# for use outside the window and the third service. The repo is public, so Actions minutes are free.
name: Keep alive

on:
  schedule:
    - cron: "*/10 4-15 * * 1-6"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API and web
        run: |
          set -u
          fail=0
          for url in https://owlaw-api.onrender.com/api/v1/health https://owlaw.co.za/; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors "$url" || echo 000)
            echo "$url -> $code"
            case "$code" in 2*|3*) ;; *) fail=1 ;; esac
          done
          exit $fail
