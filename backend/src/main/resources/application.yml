server:
  port: ${PORT:18081}

spring:
  application:
    name: legalsuite-api
  datasource:
    url: jdbc:h2:mem:legalsuite;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

legalsuite:
  jwt:
    secret: ${LEGALSUITE_JWT_SECRET:legalsuite-pro-dev-secret-change-in-production-must-be-64-chars-longXX}
    access-ms: 86400000
    refresh-ms: 604800000
  upload-dir: ${user.dir}/uploads
  pstn:
    outbound-per-minute: ${LEGALSUITE_PSTN_OUTBOUND_PER_MIN:}
    inbound-per-minute: ${LEGALSUITE_PSTN_INBOUND_PER_MIN:}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    public-base-url: ${TWILIO_PUBLIC_BASE_URL:}
    voice-from: ${TWILIO_VOICE_FROM:}
    sms-from: ${TWILIO_SMS_FROM:}
    whatsapp-from: ${TWILIO_WHATSAPP_FROM:}
    messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}
  ai:
    # local (default) never sends a prompt off the tenant.
    # openai or anthropic run only when the matching key is set.
    provider: ${LEGALSUITE_AI_PROVIDER:local}
    openai-api-key: ${OPENAI_API_KEY:}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    openai-model: ${OPENAI_MODEL:gpt-4o-mini}
    anthropic-model: ${ANTHROPIC_MODEL:claude-3-5-haiku-latest}
    openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    anthropic-base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1}
  smtp:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    user: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:}
  messaging:
    sms-unit-cost: ${LEGALSUITE_SMS_UNIT_COST:0.08}
    whatsapp-unit-cost: ${LEGALSUITE_WHATSAPP_UNIT_COST:0.05}

logging:
  level:
    com.legalsuite: INFO

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/legalsuite}
    username: ${DB_USER:legalsuite}
    password: ${DB_PASSWORD:legalsuite}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false
