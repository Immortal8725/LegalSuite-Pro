server:
  port: ${PORT:18081}
  # Set to "native" or "framework" only behind a proxy that overwrites X-Forwarded-For,
  # so the login rate limit sees the real client address.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: owlaw-api
  datasource:
    url: jdbc:h2:mem:legalsuite;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    # Entities hold ids, not lazy associations, so the session closes with the transaction.
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

legalsuite:
  # Public address of the web app, used in invite links.
  app-url: ${APP_URL:http://localhost:3000}
  # Demo firms with known passwords. Defaults on for local H2, off for the postgres profile.
  demo-data: ${LEGALSUITE_DEMO_DATA:true}
  operator:
    email: ${LEGALSUITE_OPERATOR_EMAIL:}
    password: ${LEGALSUITE_OPERATOR_PASSWORD:}
  jwt:
    secret: ${LEGALSUITE_JWT_SECRET:legalsuite-pro-dev-secret-change-in-production-must-be-64-chars-longXX}
    # Short-lived access tokens; the web app refreshes silently with the refresh token.
    access-ms: ${LEGALSUITE_ACCESS_TOKEN_MS:3600000}
    refresh-ms: ${LEGALSUITE_REFRESH_TOKEN_MS:604800000}
  upload-dir: ${LEGALSUITE_UPLOAD_DIR:${user.dir}/uploads}
  # Optional ClamAV (clamd) scan of every document upload. Off when the host is blank. Fails closed when on.
  clamav:
    host: ${LEGALSUITE_CLAMAV_HOST:}
    port: ${LEGALSUITE_CLAMAV_PORT:3310}
    timeout-ms: ${LEGALSUITE_CLAMAV_TIMEOUT_MS:15000}
  cors:
    # Comma-separated list of exact origins allowed to call the API from a browser.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  login-limit:
    # Failed sign-ins allowed per account (and per address) in the window before a 429.
    max-failures: ${LOGIN_MAX_FAILURES:8}
    max-failures-per-ip: ${LOGIN_MAX_FAILURES_PER_IP:40}
    window-seconds: ${LOGIN_WINDOW_SECONDS:900}
  pstn:
    # Owlaw price list (ex VAT): R1.49 per minute on the firm number, R8.90 with a verified own landline as caller ID.
    outbound-per-minute: ${LEGALSUITE_PSTN_OUTBOUND_PER_MIN:1.49}
    inbound-per-minute: ${LEGALSUITE_PSTN_INBOUND_PER_MIN:1.49}
    landline-per-minute: ${LEGALSUITE_PSTN_LANDLINE_PER_MIN:8.90}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
  payfast:
    merchant-id: ${PAYFAST_MERCHANT_ID:}
    merchant-key: ${PAYFAST_MERCHANT_KEY:}
    passphrase: ${PAYFAST_PASSPHRASE:}
    env: ${PAYFAST_ENV:sandbox}
    return-url: ${PAYFAST_RETURN_URL:}
    cancel-url: ${PAYFAST_CANCEL_URL:}
    notify-url: ${PAYFAST_NOTIFY_URL:}
    sandbox-local: ${PAYFAST_SANDBOX_LOCAL:false}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    public-base-url: ${TWILIO_PUBLIC_BASE_URL:}
    voice-from: ${TWILIO_VOICE_FROM:}
    sms-from: ${TWILIO_SMS_FROM:}
    whatsapp-from: ${TWILIO_WHATSAPP_FROM:}
    messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}
    api-key-sid: ${TWILIO_API_KEY_SID:}
    api-key-secret: ${TWILIO_API_KEY_SECRET:}
    twiml-app-sid: ${TWILIO_TWIML_APP_SID:}
    push-credential-sid: ${TWILIO_PUSH_CREDENTIAL_SID:}
  ai:
    # local (default) never sends a prompt off the tenant.
    # openai or anthropic run only when the matching key is set.
    provider: ${LEGALSUITE_AI_PROVIDER:local}
    openai-api-key: ${OPENAI_API_KEY:}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    openai-model: ${OPENAI_MODEL:gpt-4o-mini}
    anthropic-model: ${ANTHROPIC_MODEL:claude-3-5-haiku-latest}
    openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    anthropic-base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1}
  smtp:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    user: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:}
    starttls: ${SMTP_STARTTLS:true}
  messaging:
    sms-unit-cost: ${LEGALSUITE_SMS_UNIT_COST:0.08}
    whatsapp-unit-cost: ${LEGALSUITE_WHATSAPP_UNIT_COST:0.05}

logging:
  level:
    com.legalsuite: INFO

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    # No defaults on the hosted profile: the process must be given these.
    url: ${DATABASE_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the schema on Postgres. Hibernate only checks that the model matches.
      ddl-auto: ${JPA_DDL_AUTO:validate}
  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
    # An existing database from the older ddl-auto build has tables but no Flyway history.
    # It is marked as V1 and upgraded by V2, which is idempotent.
    baseline-on-migrate: true
    baseline-version: 1
  h2:
    console:
      enabled: false
legalsuite:
  demo-data: ${LEGALSUITE_DEMO_DATA:false}
